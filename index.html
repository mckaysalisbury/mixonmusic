<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mixon Music</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/main.css">
        <script src="https://github.mckaysalisbury.com/ListBoy/ListBoy.js" defer></script>
        <script type="module" src="dist/main.js"></script>
    </head>

    <body>
        <div id="slideshow" role="presentation" aria-hidden="true"></div>

        <header class="top-nav">
            <div class="brand-mark">Mixon Music</div>
            <nav id="top-menu" aria-label="Primary"></nav>
        </header>

        <main class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Sound in Motion</p>
                <h1>Timeless resonance built for modern rooms.</h1>
                <p>We craft immersive performances, curated sessions, and bespoke mixes that fill every space with intention.</p>
            </div>
        </main>

        <div class="flyout" id="communications-flyout">
            <button id="communications-toggle" class="flyout-toggle" aria-expanded="false" aria-controls="flyout-menu">
                Connect
            </button>
            <div class="flyout-panel">
                <div id="flyout-menu" aria-label="Communication options"></div>
            </div>
        </div>
    </body>

</html>
